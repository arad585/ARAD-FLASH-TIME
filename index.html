<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ARAD FLASH TIME</title>

    <script>
        try {
            if (localStorage.getItem("arad_theme") === "light") {
                document.documentElement.setAttribute("data-theme", "light");
            }
        } catch (e) { }
    </script>

    <style>
        :root {
            --bg: #2b2b35;
            --text: #f0f0f4;
            --muted: #b8b8c4;
            --chat-bg: #151525;
            --chat-text: #ffffff;
            --msg-bg: #24243a;
            --msg-text: #ffffff;
            --quota-bg: #24243a;
            --quota-border: #7c3aed;
            --quota-text: #c4b5fd;
            --quota-empty-border: #e11d48;
            --quota-empty-text: #fda4af;
            --accent: #7c3aed;
            --footer-text: #9a9aa8;
            --footer-border: #3c3c46;
            --shadow: rgba(0, 0, 0, 0.15);
        }

        [data-theme="light"] {
            --bg: #f4f4f7;
            --text: #1d1d26;
            --muted: #55555f;
            --chat-bg: #ffffff;
            --chat-text: #1d1d26;
            --msg-bg: #ececf2;
            --msg-text: #1d1d26;
            --quota-bg: #ececf2;
            --quota-text: #6d28d9;
            --quota-empty-border: #e11d48;
            --quota-empty-text: #be123c;
            --footer-text: #6b6b76;
            --footer-border: #d5d5dd;
            --shadow: rgba(31, 30, 40, 0.10);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
            padding: 40px 20px;
        }

        .logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            background: #f3f3f6;
            padding: 10px;
            border-radius: 22px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
            margin-top: 30px;
        }

        h1 {
            margin-top: 20px;
            font-size: 36px;
        }

        p {
            color: var(--muted);
            font-size: 18px;
        }

        .chat-box {
            margin-top: 30px;
            background: var(--chat-bg);
            color: var(--chat-text);
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        #messages {
            min-height: 200px;
            margin-bottom: 15px;
        }

        .quota-info {
            display: inline-block;
            margin: 0 0 14px;
            padding: 7px 18px;
            background: var(--quota-bg);
            border: 1px solid var(--quota-border);
            color: var(--quota-text);
            border-radius: 999px;
            font-size: 14px;
        }

        .quota-info.empty {
            border-color: var(--quota-empty-border);
            color: var(--quota-empty-text);
        }

        .message {
            background: var(--msg-bg);
            color: var(--msg-text);
            padding: 12px;
            margin: 10px 0;
            border-radius: 12px;
            text-align: right;
        }

        .message p {
            margin: 6px 0;
            line-height: 1.7;
        }

        .message p:first-child {
            margin-top: 0;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        .message ul,
        .message ol {
            margin: 8px 0;
            padding: 0 0 0 22px;
            text-align: right;
        }

        .message li {
            margin: 4px 0;
            line-height: 1.7;
        }

        .message ul li::marker {
            color: var(--accent);
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            font-family: Arial, sans-serif;
            line-height: 1.5;
            resize: none;
            overflow-y: auto;
            width: 100%;
            box-sizing: border-box;
            height: auto;
            min-height: 52px;
            max-height: 160px;
            background: #ffffff;
            color: #000000;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        [data-theme="light"] textarea {
            background: #f1f1f8;
            color: #1d1d26;
        }

        button {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px 22px;
            font-size: 16px;
            cursor: pointer;
        }

        .theme-toggle {
            position: fixed;
            top: 14px;
            right: 14px;
            padding: 9px 16px;
            font-size: 14px;
            z-index: 100;
        }

        .footer {
            margin-top: 40px;
            padding: 15px 0;
            color: var(--footer-text);
            font-size: 13px;
            border-top: 1px solid var(--footer-border);
        }
    </style>
</head>

<body>

    <button
        id="themeToggle"
        class="theme-toggle"
        onclick="toggleTheme()"
        type="button"
    >
        تم روشن
    </button>

    <div class="container">

        <h1>⚡ ARAD FLASH TIME</h1>

        <p>🤖 دستیار هوش مصنوعی شما</p>

        <img
            class="logo"
            src="logo.png.jpeg"
            alt="لوگوی ARAD FLASH TIME"
        >

        <div class="chat-box">

            <div id="quotaInfo" class="quota-info">پیام‌های باقی‌مانده: –</div>

            <div id="messages"></div>

            <div class="input-area">

                <textarea
                    id="messageInput"
                    rows="1"
                    wrap="soft"
                    placeholder="پیامت را بنویس..."
                    oninput="autoGrow(this)"
                    onkeydown="if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"
                ></textarea>

                <button onclick="sendMessage()">
                    ارسال
                </button>

            </div>

        </div>

    </div>

    <footer class="footer">
        Created by ARAD VAHIDPOUR
    </footer>

    <script>

function escapeHtml(text) {
    var div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
}

function formatMessage(text) {

    var html = escapeHtml(text);

    html = html.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*(.+?)\*/g, "<em>$1</em>");

    var lines = html.split("\n");
    var out = [];
    var list = null;
    var listItems = [];

    function flushList() {
        if (!list) {
            return;
        }
        out.push("<" + list + ">");
        for (var i = 0; i < listItems.length; i++) {
            out.push("<li>" + listItems[i] + "</li>");
        }
        out.push("</" + list + ">");
        list = null;
        listItems = [];
    }

    for (var i = 0; i < lines.length; i++) {

        var line = lines[i].trim();
        if (line === "") {
            flushList();
            continue;
        }

        var ulMatch = line.match(/^[-*•]\s+(.*)$/);
        var olMatch = line.match(/^\d+[.)]\s+(.*)$/);

        if (ulMatch) {
            if (list !== "ul") {
                flushList();
                list = "ul";
            }
            listItems.push(ulMatch[1]);
            continue;
        }

        if (olMatch) {
            if (list !== "ol") {
                flushList();
                list = "ol";
            }
            listItems.push(olMatch[1]);
            continue;
        }

        flushList();
        out.push("<p>" + line + "</p>");
    }

    flushList();

    var joined = out.join("");
    if (joined === "") {
        joined = "<p>" + html.trim() + "</p>";
    }

    return joined;
}

function updateQuotaInfo(info) {

    var badge = document.getElementById("quotaInfo");

    if (info && typeof info.remaining === "number" && typeof info.max === "number") {
        badge.textContent = "پیام‌های باقی‌مانده: " + info.remaining + " از " + info.max;
        badge.classList.toggle("empty", info.remaining === 0);
        return true;
    }

    return false;
}

function loadQuota() {
    fetch("/quota")
        .then(function (response) { return response.json(); })
        .then(updateQuotaInfo)
        .catch(function () { });
}

function autoGrow(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function sendMessage() {

    var input = document.getElementById("messageInput");
    var text = input.value.trim();

    if (text == "") {
        alert("اول یک پیام بنویس 🙂");
        return;
    }

    var messages = document.getElementById("messages");

    messages.innerHTML +=
        '<div class="message">👤 شما: ' + escapeHtml(text) + '</div>';

    input.value = "";
    autoGrow(input);

    fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            message: text
        })
    })
    .then(function(response) {
        return response.json();
    })
    .then(function(data) {

        updateQuotaInfo(data);

        messages.innerHTML +=
            '<div class="message">🤖 ARAD AI: ' +
            formatMessage(data.reply) +
            '</div>';

    })
    .catch(function(error) {

        messages.innerHTML +=
            '<div class="message">❌ اتصال به هوش مصنوعی برقرار نشد.</div>';

        console.log(error);

    });
}

function getTheme() {
    return document.documentElement.getAttribute("data-theme") === "light"
        ? "light"
        : "dark";
}

function setThemeButton(theme) {
    var btn = document.getElementById("themeToggle");
    if (btn) {
        btn.textContent = theme === "light" ? "تم تیره" : "تم روشن";
    }
}

function toggleTheme() {
    var next = getTheme() === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    try {
        localStorage.setItem("arad_theme", next);
    } catch (e) { }
    setThemeButton(next);
}

setThemeButton(getTheme());
loadQuota();
       
    </script>

</body>

</html>
